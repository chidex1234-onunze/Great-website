<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>King Chat</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #1e1e1e;
            color: #d4d4d4;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Setup / Join Room Modal Screen */
        #setup-screen {
            background-color: #252526;
            padding: 30px;
            border-radius: 8px;
            border: 1px solid #3c3c3c;
            width: 90%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Active Chat Screen Layout (Hidden initially) */
        #chat-screen {
            display: none;
            flex-direction: column;
            width: 100%;
            height: 100%;
        }

        header {
            background-color: #252526;
            padding: 15px;
            border-bottom: 1px solid #3c3c3c;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #chat-feed {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Message Styles */
        .message {
            max-width: 70%;
            padding: 10px 14px;
            border-radius: 8px;
            background-color: #2d2d30;
            align-self: flex-start;
            word-wrap: break-word;
        }
        .message.self {
            background-color: #007acc;
            color: #ffffff;
            align-self: flex-end;
        }
        .message .username {
            font-size: 0.8rem;
            color: #858585;
            margin-bottom: 3px;
            display: block;
        }
        .message.self .username {
            color: #e0e0e0;
        }
        .system-msg {
            align-self: center;
            font-size: 0.85rem;
            color: #858585;
            background: #252526;
            padding: 4px 10px;
            border-radius: 4px;
        }

        /* Form Utilities */
        footer { background-color: #252526; padding: 15px; border-top: 1px solid #3c3c3c; }
        .input-group { display: flex; gap: 10px; }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 1px solid #3c3c3c;
            border-radius: 4px;
            background-color: #3c3c3c;
            color: #fff;
            outline: none;
        }
        button {
            padding: 12px 20px;
            background-color: #0e639c;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #1177bb; }
    </style>
</head>
<body>

    <!-- SCREEN 1: JOIN / CREATE ROOM -->
    <div id="setup-screen">
        <h2>Join or Create Room</h2>
        <input type="text" id="username-input" placeholder="Enter your name..." autocomplete="off">
        <input type="text" id="room-input" placeholder="Enter Room Name (e.g. Project-Alpha)..." autocomplete="off">
        <button onclick="joinRoom()">Enter Chat</button>
    </div>

    <!-- SCREEN 2: ACTIVE CHAT ROOM Interface -->
    <div id="chat-screen">
        <header>
            <h2 id="room-title">Room: None</h2>
            <span id="user-badge" style="color: #858585;"></span>
        </header>

        <main id="chat-feed"></main>

        <footer>
            <form class="input-group" onsubmit="sendMessage(event)">
                <input type="text" id="msg-input" placeholder="Type a message..." autocomplete="off" required>
                <button type="submit">Send</button>
            </form>
        </footer>
    </div>

    <script>
        let ws;
        let myName = "";
        let myRoom = "";
        const myId = Math.random().toString(36).substring(2, 9); // Unique ID for this session

        function joinRoom() {
            myName = document.getElementById('username-input').value.trim();
            myRoom = document.getElementById('room-input').value.trim().toLowerCase();

            if (!myName || !myRoom) {
                alert("Please fill out both fields!");
                return;
            }

            // Connect to the node server backend
            ws = new WebSocket('ws://localhost:8080');

            ws.onopen = () => {
                // Tell the server we are joining this room
                ws.send(JSON.stringify({
                    action: 'join',
                    name: myName,
                    room: myRoom
                }));

                // Switch UI Screens
                document.getElementById('setup-screen').style.display = 'none';
                document.getElementById('chat-screen').style.display = 'flex';
                document.getElementById('room-title').textContent = `Room: #${myRoom}`;
                document.getElementById('user-badge').textContent = `As: ${myName}`;
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                const feed = document.getElementById('chat-feed');

                if (data.action === 'system') {
                    const sysDiv = document.createElement('div');
                    sysDiv.className = 'system-msg';
                    sysDiv.textContent = data.text;
                    feed.appendChild(sysDiv);
                } 
                else if (data.action === 'msg') {
                    const msgDiv = document.createElement('div');
                    // Check if it was sent by you or someone else
                    const isSelf = data.senderId === myId;
                    
                    msgDiv.className = `message ${isSelf ? 'self' : ''}`;
                    msgDiv.innerHTML = `<span class="username">${isSelf ? 'You' : data.name}</span>${data.text}`;
                    
                    feed.appendChild(msgDiv);
                }

                // Auto-scroll chat to bottom
                feed.scrollTop = feed.scrollHeight;
            };
        }

        function sendMessage(e) {
            e.preventDefault();
            const input = document.getElementById('msg-input');
            const text = input.value.trim();

            if (text && ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    action: 'message',
                    text: text,
                    senderId: myId
                }));
                input.value = '';
            }
        }
    </script>
</body>
</html>
