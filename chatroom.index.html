<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Chat Room</title>
    <style>
        /* Base setup for a full-height chat window */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: #1e1e1e; /* Dark theme default */
            color: #d4d4d4;
        }

        /* Header layout */
        header {
            background-color: #252526;
            padding: 15px;
            border-bottom: 1px solid #3c3c3c;
            text-align: center;
        }

        /* Message feed container (auto-scrolls) */
        #chat-feed {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Single message bubble design */
        .message {
            max-width: 70%;
            padding: 10px 14px;
            border-radius: 8px;
            background-color: #2d2d30;
            align-self: flex-start;
            word-wrap: break-word;
        }
        .message.self {
            background-color: #007acc; /* VS Code blue tint for user's own messages */
            color: #ffffff;
            align-self: flex-end;
        }

        /* Bottom input dock layout */
        footer {
            background-color: #252526;
            padding: 15px;
            border-top: 1px solid #3c3c3c;
        }
        .input-group {
            display: flex;
            gap: 10px;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px;
            border: 1px solid #3c3c3c;
            border-radius: 4px;
            background-color: #3c3c3c;
            color: #fff;
            outline: none;
        }
        button {
            padding: 10px 20px;
            background-color: #0e639c;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #1177bb;
        }
    </style>
</head>
<body>

    <header>
        <h2># project-alpha-chat</h2>
    </header>

    <!-- Chat messages load here -->
    <main id="chat-feed">
        <div class="message"><strong>Alex:</strong> Hey team, did the server restart finish?</div>
        <div class="message self"><strong>You:</strong> Yes, it's live on port 8080 now.</div>
    </main>

    <!-- Message submission controls -->
    <footer>
        <form class="input-group" onsubmit="event.preventDefault();">
            <input type="text" placeholder="Type a message to the team..." autocomplete="off" required>
            <button type="submit">Send</button>
        </form>
    </footer>

</body>
</html>
